<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZoomLens</title>
  <!-- Filled in by the server when Zoom's app context checks out. -->
  <meta name="zoomlens-ticket" content="">
  <style>
    /* Dark only, because the Zoom client this lives in is. Text colors meet
       WCAG AA (4.5:1) on both surfaces; control outlines meet 3:1. */
    :root {
      --bg:        #101319;
      --surface:   #181c24;
      --hover:     #20252f;
      --line:      #242a35;   /* separators, decorative only */
      --outline:   #646d7c;   /* edges of controls */

      --text:      #e9ecf1;
      --text-2:    #b3bcc8;
      --text-3:    #8d97a6;

      --accent:    #6ea8fe;   /* links and focus, readable on dark */
      --on-accent: #0b1220;
      --brand:     #0B5CFF;   /* the logo's blue, for the primary action and "on" */
      --brand-hover: #2a6fff;
      --ok:        #5fc195;
      --warn:      #e0a458;
      --err:       #f08b80;

      --r: 8px;
      --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
      --t: 160ms ease;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;              /* only on very short panels; otherwise just the answers scroll */
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ---- Header: the name and one status ------------------------------- */
    header {
      display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
      padding: var(--s-3) var(--s-4);
      flex: none;
    }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em; }
    h1 svg { width: 20px; height: 20px; flex: none; }

    .status {
      display: inline-flex; align-items: center; gap: 6px; min-width: 0;
      font-size: 0.75rem; color: var(--text-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; }
    .status[data-kind="ok"] .dot   { background: var(--ok); }
    .status[data-kind="warn"] .dot { background: var(--warn); }
    .status[data-kind="err"]       { color: var(--err); }
    .status[data-kind="err"] .dot  { background: var(--err); }
    .status[data-kind="busy"] .dot { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35 } }

    /* Only for something the participant can act on. */
    .notice {
      margin: 0 var(--s-4) var(--s-2); padding: var(--s-2) var(--s-3);
      border-left: 3px solid var(--err); border-radius: var(--r);
      background: var(--surface);
      font-size: 0.8rem; color: var(--text-2); flex: none;
    }
    .notice strong { color: var(--text); font-weight: 600; }

    /* ---- Actions: one primary, the rest quiet -------------------------- */
    .actions { padding: 0 var(--s-4); flex: none; }
    .primary {
      display: block; width: 100%; min-height: 38px;
      font-weight: 600; font-size: 0.88rem;
      color: #fff; background: var(--brand);
      border: 0; border-radius: var(--r); cursor: pointer;
      transition: background var(--t);
    }
    .primary:hover:not(:disabled) { background: var(--brand-hover); }
    .more { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .secondary {
      flex: 1 1 0; min-width: max-content; min-height: 32px; padding: 0 var(--s-3);
      font-size: 0.8rem; color: var(--text);
      background: var(--surface); border: 0; border-radius: var(--r); cursor: pointer;
      transition: background var(--t);
    }
    .secondary:hover:not(:disabled) { background: var(--hover); }
    .primary:disabled, .secondary:disabled { opacity: .45; cursor: not-allowed; }

    /* ---- Accessibility modes: settings, not actions -------------------- */
    .modes {
      display: grid; grid-template-columns: 1fr; gap: 0 var(--s-3);
      margin: var(--s-3) var(--s-4) 0; padding-top: var(--s-2); border-top: 1px solid var(--line); flex: none;
    }
    /* Side by side once both names fit, which saves a row in a short panel. */
    @media (min-width: 330px) { .modes { grid-template-columns: 1fr 1fr; } }
    .modes h2 { grid-column: 1 / -1; margin: 0 0 2px; font-size: 0.72rem; font-weight: 600; color: var(--text-3); }
    .mode {
      display: flex; align-items: flex-start; gap: var(--s-2); width: 100%; min-height: 32px;
      padding: 6px 0; text-align: left;
      background: none; border: 0; cursor: pointer;
    }
    .mode:disabled { opacity: .45; cursor: not-allowed; }
    .track {
      position: relative; flex: none; width: 30px; height: 18px; margin-top: 1px;
      border-radius: 9px; border: 1.5px solid var(--outline);
      transition: background var(--t), border-color var(--t);
    }
    .track::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px;
      border-radius: 50%; background: var(--text-2); transition: transform var(--t);
    }
    .mode[aria-checked="true"] .track { background: var(--brand); border-color: var(--brand); }
    .mode[aria-checked="true"] .track::after { transform: translateX(12px); background: #fff; }
    .mode-name { display: block; font-size: 0.84rem; color: var(--text); }
    .mode-help { display: block; font-size: 0.74rem; color: var(--text-3); }
    /* A short panel needs the room for answers more than the explanations,
       which screen readers still get through aria-describedby. */
    @media (max-height: 719px) { .mode-help { display: none; } }

    /* ---- Color Assist note: one slot, replaced rather than stacked ----- */
    .alert { margin: var(--s-2) var(--s-4) 0; flex: none; }
    .alert-box {
      display: flex; align-items: center; gap: var(--s-1);
      padding: 4px 4px 4px var(--s-3);
      background: var(--surface); border-left: 3px solid var(--warn); border-radius: var(--r);
      font-size: 0.8rem; color: var(--text-2);
    }
    .alert-box .msg { flex: 1 1 auto; min-width: 0; padding: 3px 0; }
    .alert-box strong { color: var(--text); font-weight: 600; }
    .alert-box .link { margin-left: 0; flex: none; }
    .close {
      flex: none; width: 28px; height: 28px; display: grid; place-items: center;
      font-size: 1rem; line-height: 1; color: var(--text-2);
      background: none; border: 0; border-radius: var(--r); cursor: pointer;
    }
    .close:hover { background: var(--hover); color: var(--text); }
    .link {
      min-height: 28px; padding: 0 var(--s-2); margin-left: calc(var(--s-2) * -1);
      background: none; border: 0; border-radius: var(--r);
      font-size: 0.8rem; font-weight: 600; color: var(--accent); cursor: pointer;
    }
    .link.quiet { color: var(--text-2); font-weight: 400; margin-left: 0; }
    .link:hover { background: var(--hover); }

    /* ---- Answers: the main content ------------------------------------- */
    /* Never squeezed to nothing: on a very short panel the page scrolls
       instead, so an answer always has room. */
    .thread {
      flex: 1 1 auto; min-height: 150px; overflow-y: auto; overscroll-behavior: contain;
      margin-top: var(--s-2); padding: 0 var(--s-4) var(--s-3);
    }
    .empty { margin: var(--s-4) 0; font-size: 0.82rem; color: var(--text-3); }

    .turn { padding: var(--s-3) 0; border-top: 1px solid var(--line); animation: rise 160ms ease-out; }
    .turn:first-child, .turn.asked + .turn { border-top: 0; }
    .turn.asked { padding-bottom: 0; }
    @keyframes rise { from { opacity: 0 } }

    .meta { display: flex; gap: 6px; font-size: 0.72rem; color: var(--text-3); margin-bottom: 3px; }
    .meta .what { font-weight: 600; color: var(--text-2); }
    .turn.failed .meta .what { color: var(--err); }
    .asked .text { color: var(--text-2); font-size: 0.84rem; }

    .text { font-size: 0.9rem; color: var(--text); overflow-wrap: anywhere; }
    .text p { margin: 0 0 6px; }
    .text p:last-child { margin-bottom: 0; }
    .older .text { color: var(--text-2); }
    .text h3 { margin: var(--s-2) 0 2px; font-size: 0.74rem; font-weight: 600; color: var(--text-3); }
    .text h3:first-child { margin-top: 0; }
    .text dl { margin: 0 0 6px; }
    .text dl div {
      display: flex; justify-content: space-between; gap: var(--s-3);
      padding: 4px 0; border-bottom: 1px solid var(--line);
    }
    .text dl div:last-child { border-bottom: 0; }
    .text dt { color: var(--text-2); }
    .text dd { margin: 0; text-align: right; font-weight: 600; }
    .source { margin-top: 6px; font-size: 0.74rem; color: var(--text-3); }
    .turn .link { margin-top: 4px; }

    .thinking { display: flex; align-items: center; gap: var(--s-2); font-size: 0.84rem; color: var(--text-2); }
    .thinking::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
      background: var(--accent); animation: pulse 1.4s ease-in-out infinite;
    }

    /* ---- Asking ----------------------------------------------------------- */
    .composer { flex: none; padding: var(--s-2) var(--s-4) var(--s-3); border-top: 1px solid var(--line); }
    .field {
      display: flex; align-items: center; gap: var(--s-2);
      background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r);
      padding: 3px 3px 3px 11px;
    }
    .field:focus-within { border-color: var(--accent); }
    .field input {
      flex: 1 1 auto; min-width: 0; padding: 6px 0;
      font: inherit; font-size: 0.86rem; color: var(--text); background: none; border: 0;
    }
    .field input::placeholder { color: var(--text-3); }
    .field input:focus { outline: none; }
    .field button {
      flex: none; width: 32px; height: 32px; display: grid; place-items: center;
      font-size: 0.9rem; color: #fff; background: var(--brand);
      border: 0; border-radius: 6px; cursor: pointer;
    }
    .field button:disabled { opacity: .35; cursor: not-allowed; }
    .hint { margin: 6px 0 0; font-size: 0.74rem; color: var(--text-3); }

    /* ---- Diagnostics: development and failures only --------------------- */
    .diag { flex: none; padding: 0 var(--s-4) var(--s-3); font-size: 0.74rem; }
    .diag summary { cursor: pointer; color: var(--text-3); padding: 2px 0; }
    .diag dl { margin: var(--s-2) 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px var(--s-3); }
    .diag dt { color: var(--text-3); }
    .diag dd { margin: 0; text-align: right; overflow-wrap: anywhere;
               font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-2); }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M8 20v-8a4 4 0 0 1 4-4h8M44 8h8a4 4 0 0 1 4 4v8M56 44v8a4 4 0 0 1-4 4h-8M20 56h-8a4 4 0 0 1-4-4v-8" fill="none" stroke="#7DB3FF" stroke-width="4" stroke-linecap="round"/>
        <rect x="18" y="22" width="28" height="20" rx="4" fill="#2D8CFF"/>
        <path d="M24 29h12M24 35h7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </svg>
      ZoomLens
    </h1>
    <div class="status" id="state" data-kind="busy" role="status">
      <span class="dot" aria-hidden="true"></span><span id="state-text">Connecting</span>
    </div>
  </header>

  <div class="notice" id="notice" role="alert" hidden></div>

  <div class="actions">
    <button class="primary" type="button" data-mode="describe" disabled>Describe screen</button>
    <div class="more">
      <button class="secondary" type="button" data-mode="explain" disabled>Explain</button>
      <button class="secondary" type="button" data-mode="changed" disabled>What changed?</button>
      <button class="secondary" type="button" data-mode="colors" id="btn-colors" hidden disabled>Explain colors</button>
    </div>
  </div>

  <section class="modes" aria-labelledby="modes-title">
    <h2 id="modes-title">Accessibility</h2>
    <button class="mode" type="button" role="switch" aria-checked="false" data-feature="changes"
            aria-labelledby="changes-name" aria-describedby="changes-help" disabled>
      <span class="track" aria-hidden="true"></span>
      <span>
        <span class="mode-name" id="changes-name">Announce changes</span>
        <span class="mode-help" id="changes-help">Describes the screen as it changes</span>
      </span>
    </button>
    <button class="mode" type="button" role="switch" aria-checked="false" data-feature="color"
            aria-labelledby="color-name" aria-describedby="color-help" disabled>
      <span class="track" aria-hidden="true"></span>
      <span>
        <span class="mode-name" id="color-name">Color Assist</span>
        <span class="mode-help" id="color-help">Explains anything shown only by color</span>
      </span>
    </button>
  </section>

  <!-- Always present, so screen readers announce a note when one appears. -->
  <div class="alert" id="alert" role="status"></div>

  <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Answers">
    <p class="empty" id="empty">Connecting…</p>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="field">
      <label class="sr-only" for="q">Ask about the shared screen</label>
      <input id="q" type="text" maxlength="300" placeholder="Ask about the shared screen…" disabled>
      <button id="send" type="submit" disabled aria-label="Send question">↑</button>
    </div>
    <p class="hint">Only you see these answers.</p>
  </form>

  <details class="diag" id="diag" hidden>
    <summary>Connection details</summary>
    <dl>
      <dt>Zoom</dt>      <dd id="d-zoom">checking</dd>
      <dt>Backend</dt>   <dd id="d-link">connecting</dd>
      <dt>Meeting</dt>   <dd id="d-meeting">unknown</dd>
      <dt>Viewing as</dt><dd id="d-viewer">unknown</dd>
    </dl>
  </details>

  <script src="https://appssdk.zoom.us/sdk.js"></script>
  <script src="panel.js"></script>
</body>
</html>
